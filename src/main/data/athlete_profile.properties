# Profil stable de l'athlete.
# Ces champs remplacent ce que l'utilisateur ne doit pas retaper a chaque lancement.

training_age=intermediate
sessions_per_week=4
available_days=4
equipment=full_gym
preferences=none
injuries=none
forbidden_exercises=none
preferred_sport=auto

# Les champs historiques sont calcules depuis data/training_history.csv.
max_hr=190
rest_hr=55
vma_kmh=14

# Fallback global si l'historique structure ne contient pas encore un exercice.
last_load_kg=60
last_reps=8
last_rpe=7
